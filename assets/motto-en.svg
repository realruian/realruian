<svg xmlns="http://www.w3.org/2000/svg" width="700" height="42" viewBox="0 0 700 42" role="img" aria-labelledby="title desc">
  <title id="title">Personal introduction</title>
  <desc id="desc">AI Product Engineer at Meituan. Make it work, then make it quiet.</desc>
  <style>
    .line, .cursor { fill: #57606a; }
    .line {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }
    .reveal { width: 0; animation: typing 6.5s steps(64, end) infinite; }
    .cursor {
      x: 100px;
      animation: cursor-move 6.5s steps(64, end) infinite, blink 0.75s step-end infinite;
    }
    @media (prefers-color-scheme: dark) {
      .line, .cursor { fill: #8c959f; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { width: 500px; animation: none; }
      .cursor { x: 604px; animation: none; }
    }
    @keyframes typing {
      0% { width: 0; }
      62% { width: 500px; }
      88% { width: 500px; }
      100% { width: 0; }
    }
    @keyframes cursor-move {
      0% { x: 100px; }
      62% { x: 600px; }
      88% { x: 600px; }
      100% { x: 100px; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
  <defs><clipPath id="typing-clip"><rect class="reveal" x="100" y="0" height="42" /></clipPath></defs>
  <text class="line" x="100" y="25" textLength="500" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-clip)">AI Product Engineer @ Meituan · make it work, then make it quiet</text>
  <rect class="cursor" y="11" width="2" height="16" rx="1" />
</svg>