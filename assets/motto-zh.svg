<svg xmlns="http://www.w3.org/2000/svg" width="520" height="40" viewBox="0 0 520 40" role="img" aria-labelledby="title desc">
  <title id="title">个人理念</title>
  <desc id="desc">先让它跑起来，再让它安静下来</desc>
  <style>
    .motto {
      fill: #57606a;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      opacity: 0;
      animation: reveal 1.2s ease-out 0.15s forwards;
    }
    .cursor {
      animation: breathe 1.8s ease-in-out 1.35s infinite;
    }
    @media (prefers-color-scheme: dark) {
      .motto { fill: #8c959f; }
    }
    @media (prefers-reduced-motion: reduce) {
      .motto { opacity: 1; animation: none; }
      .cursor { opacity: 0.55; animation: none; }
    }
    @keyframes reveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
  </style>
  <text class="motto" x="50%" y="24" text-anchor="middle">
    <tspan>先让它跑起来，再让它安静下来</tspan><tspan class="cursor">_</tspan>
  </text>
</svg>
