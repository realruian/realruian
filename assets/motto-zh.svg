<svg xmlns="http://www.w3.org/2000/svg" width="700" height="24" viewBox="0 0 700 24" role="img" aria-labelledby="title desc">
  <title id="title">个人介绍</title>
  <desc id="desc">美团 AI 产品工程师，先让它跑起来，再让它安静下来。</desc>
  <style>
    .line, .cursor { fill: #57606a; }
    .line {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
    }
    .reveal { width: 0; animation: typing 6.5s steps(31, end) infinite; }
    .cursor {
      x: 40px;
      animation: cursor-move 6.5s steps(31, end) infinite, blink 0.75s step-end infinite;
    }
    @media (prefers-color-scheme: dark) {
      .line, .cursor { fill: #8c959f; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { width: 620px; animation: none; }
      .cursor { x: 660px; animation: none; }
    }
    @keyframes typing {
      0% { width: 0; }
      62% { width: 620px; }
      88% { width: 620px; }
      100% { width: 0; }
    }
    @keyframes cursor-move {
      0% { x: 40px; }
      62% { x: 660px; }
      88% { x: 660px; }
      100% { x: 40px; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
  <defs><clipPath id="typing-clip"><rect class="reveal" x="40" y="0" height="24" /></clipPath></defs>
  <text class="line" x="40" y="17" textLength="620" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-clip)">美团 AI 产品工程师 · 先让它跑起来，再让它安静下来</text>
  <rect class="cursor" y="3" width="2.5" height="18" rx="1" />
</svg>
